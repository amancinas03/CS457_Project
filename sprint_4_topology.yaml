        content: |-
          #cloud-config
          hostname: amp-Server

          manage_etc_hosts: true
          system_info:
            default_user:
              name: cisco
          password: cisco
          chpasswd: { expire: false }
          ssh_pwauth: true

          bootcmd:
            - ip link set ens2 up
            - ip addr add 192.168.20.100/24 dev ens2
            - ip route add default via 192.168.20.1 dev ens2
            - echo "nameserver 192.168.20.1" | sudo tee /etc/resolv.conf
